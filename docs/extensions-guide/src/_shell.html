<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>try{var m=localStorage.getItem("guide-theme");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m}catch(e){}</script>
<style>
/*CSS*/
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#top">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" style="fill:var(--ink)"/><path d="M6.5 9h13M10 9v9.5M16 9v7.2c0 1.4.7 2.1 2 2.1" style="fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round"/><circle cx="20" cy="18.6" r="1.6" style="fill:var(--accent)"/></svg>
    <span>pi-personal-extensions <small>{{BRAND}}</small></span>
  </a>
  <span class="spacer"></span>
  <details class="mtoc"><summary>章节</summary><ol>
<!--MTOC-->
  </ol></details>
  <div class="theme-switch" role="group" aria-label="外观">
    <button type="button" data-mode="light" aria-label="浅色"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button type="button" data-mode="system" aria-label="跟随系统"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button type="button" data-mode="dark" aria-label="深色"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
  </div>
</header>

<div class="layout" id="top">
  <nav class="sidebar" aria-label="章节">
    <h2>章节</h2>
    <ol class="toc">
<!--TOC-->
    </ol>
    <p class="side-note">点任意句子从那里朗读。<kbd>空格</kbd> 播放或暂停，<kbd>J</kbd> / <kbd>K</kbd> 下一句、上一句。双击章节名从该章开头朗读。</p>
  </nav>

  <main>
<!--HERO-->
<!--CHAPTERS-->
  </main>
</div>

<div class="dock" role="region" aria-label="朗读播放器">
  <div class="dock-controls">
    <button class="btn icon-btn" type="button" id="prev" aria-label="上一句"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3L5 8l8 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    <button class="play" type="button" id="play" aria-label="开始朗读"></button>
    <button class="btn icon-btn" type="button" id="next" aria-label="下一句"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3l8 5-8 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="dock-mid">
    <div class="now" aria-live="off"><span class="ch" id="now-ch">朗读全文</span><span class="line" id="now-line">点播放，或点正文里任意一句。</span></div>
    <div class="rail" id="rail" role="slider" tabindex="0" aria-label="朗读进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span class="fill"></span><span class="flag"></span><span class="knob"></span></div>
  </div>
  <div class="dock-right">
    <span class="dock-msg" id="dock-msg" role="status"></span>
    <span class="time" id="time">0:00</span>
    <button class="chip" type="button" id="rate" aria-label="朗读速度">1×</button>
    <button class="chip" type="button" id="follow" aria-pressed="true">跟随滚动</button>
  </div>
</div>

<script>window.NARRATION = /*NARRATION*/;</script>
<script>
/*JS*/
</script>
</body>
</html>
